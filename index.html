<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pato de Hule 3D Hiperrealista - Simulador Físico</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            touch-action: none;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .interactive-ui {
            pointer-events: auto;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.4);
        }
        .btn-action {
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .btn-action:hover {
            transform: translateY(-2px) scale(1.03);
        }
        .btn-action:active {
            transform: translateY(1px) scale(0.95);
        }
        .env-active {
            background: linear-gradient(135deg, #facc15, #eab308) !important;
            color: #0f172a !important;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.4);
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2.2); opacity: 0; }
        }
        .squeak-indicator {
            position: absolute;
            pointer-events: none;
            border: 3px solid #facc15;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            margin-left: -20px;
            margin-top: -20px;
            animation: pulse-ring 0.6s cubic-bezier(0.215, 0.61, 0.355, 1) forwards;
            z-index: 20;
        }
    </style>
</head>
<body>

    <!-- Contenedor 3D -->
    <div id="canvas-container"></div>

    <!-- Interfaz de Usuario -->
    <div class="ui-layer p-3 sm:p-6">
        
        <!-- Barra Superior: Estadísticas y Controles de Audio -->
        <div class="flex flex-wrap items-start justify-between gap-3 w-full max-w-6xl mx-auto">
            
            <!-- Título y Contadores -->
            <div class="glass-panel interactive-ui rounded-2xl p-3.5 sm:px-5 sm:py-4 text-white flex items-center gap-4 sm:gap-6">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl bg-yellow-400 flex items-center justify-center text-slate-900 shadow-lg shadow-yellow-400/30 font-extrabold text-xl sm:text-2xl">
                        🦆
                    </div>
                    <div>
                        <h1 class="font-extrabold text-sm sm:text-lg tracking-tight text-yellow-400 leading-tight">Pato de Hule PBR</h1>
                        <p class="text-[11px] sm:text-xs text-slate-300">Toca para apretar • Arrastra y suelta</p>
                    </div>
                </div>

                <div class="h-8 w-px bg-slate-700"></div>

                <!-- Estadísticas en tiempo real -->
                <div class="flex gap-4 sm:gap-6 text-xs sm:text-sm">
                    <div>
                        <span class="text-slate-400 block text-[10px] uppercase tracking-wider font-semibold">Chillidos</span>
                        <span id="stat-squeaks" class="font-extrabold text-base sm:text-xl text-white">0</span>
                    </div>
                    <div>
                        <span class="text-slate-400 block text-[10px] uppercase tracking-wider font-semibold">Fuerza G</span>
                        <div class="flex items-center gap-1.5 mt-0.5">
                            <div class="w-14 sm:w-20 h-2.5 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                                <div id="force-bar" class="h-full bg-gradient-to-r from-emerald-400 via-yellow-400 to-rose-500 w-0 transition-all duration-100"></div>
                            </div>
                            <span id="stat-force" class="font-mono text-xs text-yellow-300 w-8">0.0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Panel de Audio y Cámara -->
            <div class="glass-panel interactive-ui rounded-2xl p-2.5 sm:p-3 text-white flex items-center gap-2 sm:gap-3">
                <button id="btn-mute" class="btn-action w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-slate-800/90 hover:bg-slate-700 flex items-center justify-center text-yellow-400 border border-slate-700" title="Activar/Silenciar Sonido">
                    <svg id="icon-sound-on" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                    <svg id="icon-sound-off" xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 hidden text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>
                </button>
                <div class="hidden sm:flex items-center gap-2 pr-2">
                    <input id="volume-slider" type="range" min="0" max="1" step="0.05" value="0.85" class="w-20 accent-yellow-400 cursor-pointer h-1.5 bg-slate-700 rounded-lg">
                </div>
                <button id="btn-reset-cam" class="btn-action px-3 py-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-xs font-semibold text-slate-200 border border-slate-700" title="Centrar Vista">
                    Centrar Vista
                </button>
            </div>
        </div>

        <!-- Indicador Central Flotante (Ayuda inicial) -->
        <div id="hint-banner" class="self-center glass-panel px-4 py-2 rounded-full text-xs sm:text-sm text-yellow-200/90 font-medium tracking-wide pointer-events-none transition-opacity duration-700">
            ✨ Presiona el pato para hacerlo chillar o lánzalo por los aires
        </div>

        <!-- Barra Inferior: Acciones Físicas y Selector de Escenario -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-3 w-full max-w-5xl mx-auto pb-1">
            
            <!-- Botones de Acción Directa -->
            <div class="glass-panel interactive-ui rounded-2xl p-2 flex items-center gap-2 w-full sm:w-auto justify-center">
                <button id="btn-squeeze" class="btn-action flex-1 sm:flex-initial px-4 py-2.5 sm:px-5 sm:py-3 rounded-xl bg-gradient-to-r from-yellow-400 to-amber-500 text-slate-950 font-extrabold text-xs sm:text-sm shadow-lg shadow-yellow-500/20 flex items-center justify-center gap-2">
                    <span>🤏</span> Apretar Fuerte
                </button>
                <button id="btn-drop" class="btn-action flex-1 sm:flex-initial px-4 py-2.5 sm:px-5 sm:py-3 rounded-xl bg-gradient-to-r from-sky-400 to-blue-600 text-white font-extrabold text-xs sm:text-sm shadow-lg shadow-sky-500/20 flex items-center justify-center gap-2">
                    <span>🚀</span> Lanzar de Arriba
                </button>
                <button id="btn-spin" class="btn-action px-3.5 py-2.5 sm:px-4 sm:py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-semibold text-xs sm:text-sm border border-slate-700 flex items-center justify-center gap-1.5" title="Dar un golpe con giro">
                    <span>🌪️</span> Giro
                </button>
            </div>

            <!-- Selector de Superficie / Entorno -->
            <div class="glass-panel interactive-ui rounded-2xl p-1.5 flex items-center gap-1.5 w-full sm:w-auto justify-center text-xs sm:text-sm">
                <button data-env="studio" class="env-btn env-active btn-action flex-1 sm:flex-initial px-3.5 py-2 rounded-xl text-slate-200 font-medium transition-all">
                    📸 Estudio
                </button>
                <button data-env="water" class="env-btn btn-action flex-1 sm:flex-initial px-3.5 py-2 rounded-xl text-slate-200 font-medium transition-all">
                    🛁 Agua Viva
                </button>
                <button data-env="wood" class="env-btn btn-action flex-1 sm:flex-initial px-3.5 py-2 rounded-xl text-slate-200 font-medium transition-all">
                    🪵 Madera
                </button>
            </div>

        </div>
    </div>

    <script>
        /**
         * ============================================================================
         * 1. SINTETIZADOR DE SONIDO DE PATO DE HULE (WEB AUDIO API)
         * Genera el sonido de aire comprimido + lengüeta ("squeaker") al apretar
         * y el sonido de succión/re-inflado al soltar o rebotar.
         * ============================================================================
         */
        class RubberDuckAudio {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.volume = 0.85;
                this.isSqueaking = false;
            }

            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            /**
             * Reproduce el característico chillido de juguete de hule ("Squeak")
             * @param {number} intensity - Fuerza del impacto o apretón (0.1 a 1.5)
             * @param {string} type - 'squeeze' (apretón), 'release' (re-inflado), 'bounce' (impacto)
             */
            playSqueak(intensity = 0.8, type = 'bounce') {
                if (this.muted) return;
                this.init();
                if (!this.ctx) return;

                const now = this.ctx.currentTime;
                const force = Math.min(Math.max(intensity, 0.15), 1.5);

                // Ganancia Maestra
                const masterGain = this.ctx.createGain();
                masterGain.gain.setValueAtTime(0.001, now);
                masterGain.connect(this.ctx.destination);

                // 1. Oscilador Principal (Lengüeta de plástico vibrando)
                const osc = this.ctx.createOscillator();
                osc.type = 'sawtooth';

                // 2. Oscilador Modulador FM (Añade la textura nasal/chillona del caucho)
                const modOsc = this.ctx.createOscillator();
                const modGain = this.ctx.createGain();
                modOsc.type = 'sine';
                modOsc.frequency.setValueAtTime(38 + force * 25, now);
                modGain.gain.setValueAtTime(45 * force, now);
                modOsc.connect(modGain);
                modGain.connect(osc.frequency);

                // Filtro Paso-Banda resonante (simula la cavidad hueca del pato de hule)
                const bandpass = this.ctx.createBiquadFilter();
                bandpass.type = 'bandpass';
                bandpass.Q.setValueAtTime(5.5, now);

                // Configuración según tipo de interacción
                let duration = 0.22;
                const pitchVariation = (Math.random() - 0.5) * 70;

                if (type === 'squeeze') {
                    duration = 0.26 + force * 0.14;
                    const baseFreq = 920 + force * 380 + pitchVariation;
                    
                    // Curva de tono característica de un pato de hule al apretar
                    osc.frequency.setValueAtTime(baseFreq * 0.72, now);
                    osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.32, now + 0.055);
                    osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.12, now + duration * 0.65);
                    osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.62, now + duration);

                    bandpass.frequency.setValueAtTime(baseFreq * 1.5, now);
                    bandpass.frequency.exponentialRampToValueAtTime(baseFreq * 1.9, now + 0.07);

                    const peakGain = Math.min(force * 0.55, 0.75) * this.volume;
                    masterGain.gain.linearRampToValueAtTime(peakGain, now + 0.025);
                    masterGain.gain.exponentialRampToValueAtTime(peakGain * 0.65, now + duration * 0.6);
                    masterGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                } else if (type === 'release') {
                    // Sonido de aire entrando de vuelta al pato al des-aplastarse
                    duration = 0.20 + force * 0.12;
                    const baseFreq = 680 + pitchVariation;

                    osc.frequency.setValueAtTime(baseFreq * 0.65, now);
                    osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.18, now + duration * 0.45);
                    osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.95, now + duration);

                    bandpass.frequency.setValueAtTime(1100, now);

                    const peakGain = Math.min(force * 0.32, 0.45) * this.volume;
                    masterGain.gain.linearRampToValueAtTime(peakGain, now + 0.04);
                    masterGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                } else {
                    // Impacto / Rebote rápido contra el suelo
                    duration = 0.13 + force * 0.15;
                    const baseFreq = 1020 + force * 480 + pitchVariation;

                    osc.frequency.setValueAtTime(baseFreq * 0.8, now);
                    osc.frequency.exponentialRampToValueAtTime(baseFreq * 1.42, now + 0.035);
                    osc.frequency.exponentialRampToValueAtTime(baseFreq * 0.72, now + duration);

                    bandpass.frequency.setValueAtTime(baseFreq * 1.6, now);

                    const peakGain = Math.min(force * 0.65, 0.85) * this.volume;
                    masterGain.gain.linearRampToValueAtTime(peakGain, now + 0.012);
                    masterGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

                    // Golpe sordo del caucho contra el suelo ("thud")
                    this.playRubberThud(force);
                }

                // 3. Ruido de Aire (Soplido a través de la válvula del pato)
                const bufferSize = Math.floor(this.ctx.sampleRate * duration);
                const noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }
                const whiteNoise = this.ctx.createBufferSource();
                whiteNoise.buffer = noiseBuffer;

                const noiseFilter = this.ctx.createBiquadFilter();
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.setValueAtTime(2400, now);
                noiseFilter.Q.setValueAtTime(2.5, now);

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0.18 * force * this.volume, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + duration);

                whiteNoise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(this.ctx.destination);

                // Conexión principal
                osc.connect(bandpass);
                bandpass.connect(masterGain);

                osc.start(now);
                modOsc.start(now);
                whiteNoise.start(now);

                osc.stop(now + duration);
                modOsc.stop(now + duration);
                whiteNoise.stop(now + duration);
            }

            // Sonido grave de impacto de goma o chapoteo en agua
            playRubberThud(force, isWater = false) {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;

                if (isWater) {
                    // Sonido de chapoteo ("splash")
                    const dur = 0.25;
                    const bufSize = Math.floor(this.ctx.sampleRate * dur);
                    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
                    const data = buf.getChannelData(0);
                    for (let i = 0; i < bufSize; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (this.ctx.sampleRate * 0.08));
                    
                    const src = this.ctx.createBufferSource();
                    src.buffer = buf;
                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.setValueAtTime(600, now);
                    filter.frequency.exponentialRampToValueAtTime(1800, now + dur);

                    const gain = this.ctx.createGain();
                    gain.gain.setValueAtTime(Math.min(force * 0.4, 0.5) * this.volume, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);

                    src.connect(filter);
                    filter.connect(gain);
                    gain.connect(this.ctx.destination);
                    src.start(now);
                    return;
                }

                const thudOsc = this.ctx.createOscillator();
                const thudGain = this.ctx.createGain();
                thudOsc.type = 'sine';
                thudOsc.frequency.setValueAtTime(135 + force * 40, now);
                thudOsc.frequency.exponentialRampToValueAtTime(38, now + 0.09);

                thudGain.gain.setValueAtTime(Math.min(force * 0.45, 0.6) * this.volume, now);
                thudGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

                thudOsc.connect(thudGain);
                thudGain.connect(this.ctx.destination);
                thudOsc.start(now);
                thudOsc.stop(now + 0.095);
            }
        }

        const audio = new RubberDuckAudio();

        /**
         * ============================================================================
         * 2. GENERADOR DE TEXTURAS Y HDRI PROCEDURALES (HIPERREALISMO)
         * Crea el mapa de entorno HDRI de estudio, micro-textura de hule/vinilo,
         * y texturas de madera sin depender de imágenes externas.
         * ============================================================================
         */
        function createStudioEnvMap(renderer) {
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            pmremGenerator.compileEquirectangularShader();

            const envScene = new THREE.Scene();
            envScene.background = new THREE.Color(0x1e293b);

            // Softboxes de estudio fotográfico para reflejos especulares hiperrealistas
            const softboxGeo = new THREE.PlaneGeometry(14, 14);
            
            // Luz principal superior cálida
            const topLightMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
            const topBox = new THREE.Mesh(softboxGeo, topLightMat);
            topBox.position.set(0, 15, 0);
            topBox.rotation.x = Math.PI / 2;
            envScene.add(topBox);

            // Softbox lateral izquierdo (Key light intenso)
            const keyMat = new THREE.MeshBasicMaterial({ color: 0xfffbeb, side: THREE.DoubleSide });
            const keyBox = new THREE.Mesh(new THREE.PlaneGeometry(12, 18), keyMat);
            keyBox.position.set(-14, 6, 10);
            keyBox.lookAt(0, 0, 0);
            envScene.add(keyBox);

            // Softbox derecho azulado (Rim light)
            const rimMat = new THREE.MeshBasicMaterial({ color: 0xbae6fd, side: THREE.DoubleSide });
            const rimBox = new THREE.Mesh(new THREE.PlaneGeometry(12, 16), rimMat);
            rimBox.position.set(15, 5, -8);
            rimBox.lookAt(0, 0, 0);
            envScene.add(rimBox);

            // Tira LED frontal para el brillo en los ojos del pato (Eye catchlight)
            const catchMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
            const catchBox = new THREE.Mesh(new THREE.SphereGeometry(2.2, 16, 16), catchMat);
            catchBox.position.set(4, 6, 15);
            envScene.add(catchBox);

            const envRT = pmremGenerator.fromScene(envScene, 0.035);
            pmremGenerator.dispose();
            return envRT.texture;
        }

        // Genera mapa de microrugosidad (bump/roughness) de caucho/hule moldeado
        function createRubberMicroTexture() {
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            const imgData = ctx.createImageData(size, size);
            const data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
                // Ruido fino granulado característico del vinilo moldeado por rotación
                const grain = 128 + (Math.random() - 0.5) * 38;
                data[i] = grain;
                data[i + 1] = grain;
                data[i + 2] = grain;
                data[i + 3] = 255;
            }
            ctx.putImageData(imgData, 0, 0);

            // Suavizado ligero para simular poros de goma
            ctx.globalAlpha = 0.35;
            ctx.drawImage(canvas, 1, 1);

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(8, 8);
            return texture;
        }

        // Genera textura de tablones de madera realista
        function createWoodTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 1024;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#5c3a21';
            ctx.fillRect(0, 0, 1024, 1024);

            // Vetas de madera
            for (let i = 0; i < 450; i++) {
                ctx.fillStyle = i % 2 === 0 ? 'rgba(42, 24, 12, 0.14)' : 'rgba(120, 78, 45, 0.12)';
                const y = Math.random() * 1024;
                const h = 2 + Math.random() * 12;
                ctx.fillRect(0, y, 1024, h);
            }

            // Divisiones de tablones
            ctx.strokeStyle = 'rgba(25, 14, 6, 0.65)';
            ctx.lineWidth = 4;
            const planks = 8;
            const step = 1024 / planks;
            for (let i = 0; i <= planks; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * step);
                ctx.lineTo(1024, i * step);
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(3, 3);
            return tex;
        }

        /**
         * ============================================================================
         * 3. CONFIGURACIÓN DE ESCENA THREE.JS E ILUMINACIÓN
         * ============================================================================
         */
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);
        scene.fog = new THREE.FogExp2(0x0f172a, 0.022);

        const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 3.6, 8.8);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.15;
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        // Asignar HDRI procedural
        const envMap = createStudioEnvMap(renderer);
        scene.environment = envMap;

        // Luces
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xfffbeb, 1.8);
        mainLight.position.set(5, 11, 6);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 1;
        mainLight.shadow.camera.far = 25;
        const d = 7;
        mainLight.shadow.camera.left = -d;
        mainLight.shadow.camera.right = d;
        mainLight.shadow.camera.top = d;
        mainLight.shadow.camera.bottom = -d;
        mainLight.shadow.bias = -0.0005;
        scene.add(mainLight);

        const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.9);
        rimLight.position.set(-7, 5, -6);
        scene.add(rimLight);

        // 1. CUERPO ESCULPIDO DEL PATO (Con pecho redondeado, lomo curvo y cola levantada)
        function createSculptedBodyGeometry() {
            const geo = new THREE.SphereGeometry(1.15, 64, 64);
            const pos = geo.attributes.position;
            const v = new THREE.Vector3();

            for (let i = 0; i < pos.count; i++) {
                v.fromBufferAttribute(pos, i);

                // Alargar en el eje Z (frente es +Z, cola es -Z)
                v.z *= 1.28;
                v.x *= 0.96;

                // Base plana del pato de hule (con el borde redondeado típico del molde)
                if (v.y < -0.52) {
                    const flattenFactor = (v.y + 0.52) * 0.18;
                    v.y = -0.55 + flattenFactor;
                    // Ensanchar ligeramente la base para estabilidad visual
                    v.x *= 1.04;

                // Esculpir la cola levantada y puntiaguda en la parte trasera (-Z)
                if (v.z < -0.45 && v.y > -0.3) {
                    const tailFactor = Math.pow((-v.z - 0.45) / 1.0, 1.5);
                    v.y += tailFactor * 0.55;
                    v.x *= Math.max(0.25, 1.0 - tailFactor * 0.55);
                    v.z -= tailFactor * 0.18;
                }

                // Pecho prominente hacia adelante (+Z)
                if (v.z > 0.3 && v.y < 0.4) {
                    const chestFactor = (v.z - 0.3) / 1.2;
                    v.z += Math.sin(chestFactor * Math.PI * 0.5) * 0.16;
                }

                // Costura sutil del molde alrededor del pato
                if (Math.abs(v.x) < 0.025) {
                    v.y += 0.004;
                }

                pos.setXYZ(i, v.x, v.y, v.z);
            }
            geo.computeVertexNormals();
            return geo;

        function createWingGeometry(isLeft) {
            const geo = new THREE.SphereGeometry(0.62, 48, 48);

                    v.x += featherWave * dir;

                pos.setXYZ(i, v.x, v.y, v.z);
            }
            geo.computeVertexNormals();
            return geo;

        /**
         * Aplica deformación por vértices a las mallas del pato cuando el usuario lo presiona

        function updateSoftBodyVertices() {
            const pStrength = physics.pokeStrength;
            const globalSquish = 1.0 - physics.squashY; // > 0 cuando está aplastado

            // Si no hay deformación apreciable, restaurar rápido
            if (Math.abs(pStrength) < 0.002 && Math.abs(globalSquish) < 0.002) {
                return;
            }

            const pokeLocal = physics.pokePointLocal;
            const tempV = new THREE.Vector3();

            for (let m = 0; m < deformableMeshes.length; m++) {
                const mesh = deformableMeshes[m];
                const posAttr = mesh.geometry.attributes.position;
                const orig = mesh.userData.origPositions;

                for (let i = 0; i < posAttr.count; i++) {
                    const ix = i * 3;
                    tempV.set(orig[ix], orig[ix + 1], orig[ix + 2]);

                    // Convertir coordenada local de la sub-malla al espacio de duckDeformGroup
                    const worldInDuck = tempV.clone().applyEuler(mesh.rotation).add(mesh.position);

                    // 1. Hundimiento local por presión directa del dedo/cursor (Gaussian dent + abombamiento lateral)
                    if (pStrength > 0.005) {
                        const dist = worldInDuck.distanceTo(pokeLocal);
                        const radius = 0.95;
                        if (dist < radius) {
                            const falloff = Math.cos((dist / radius) * (Math.PI * 0.5));
                            const indent = falloff * falloff * pStrength * 0.34;
                            // Hundir hacia el centro del pato
                            tempV.multiplyScalar(1.0 - indent);
                        } else if (dist < radius * 1.6) {

                            tempV.x *= (1.0 + bulge);
                            tempV.z *= (1.0 + bulge);
                        }

                    // 2. Aplastamiento plano de la panza al chocar contra el suelo
                    if (globalSquish > 0.01 && worldInDuck.y < -0.25) {
                        const bellyFactor = Math.min(1.0, (-0.25 - worldInDuck.y) / 0.6);
                        tempV.x *= (1.0 + globalSquish * bellyFactor * 0.35);
                        tempV.z *= (1.0 + globalSquish * bellyFactor * 0.35);
                    }

                    posAttr.setXYZ(i, tempV.x, tempV.y, tempV.z);
                }
                posAttr.needsUpdate = true;
            }
        }
